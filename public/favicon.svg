<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Window frame -->
  <rect x="10" y="14" width="44" height="36" rx="4" fill="#0f172a" stroke="#67e8f9" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="10" y="14" width="44" height="8" rx="4" fill="#1e40af"/>
  <rect x="10" y="18" width="44" height="4" fill="#1e40af"/>
  <!-- Title bar dots -->
  <circle cx="16" cy="18" r="1.5" fill="#fbbf24"/>
  <circle cx="21" cy="18" r="1.5" fill="#34d399"/>
  <circle cx="26" cy="18" r="1.5" fill="#f87171"/>
  <!-- Code brackets -->
  <text x="20" y="40" font-family="monospace" font-size="16" font-weight="bold" fill="#67e8f9">&lt;/&gt;</text>
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
